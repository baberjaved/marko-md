# Tag a release (git tag v0.2.0 && git push --tags) and this builds the Mac DMG and the Windows zip
# and attaches them to a GitHub Release. Add MAC_SIGN_IDENTITY / notarization later for warning-free installs.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: app/mac/build.sh --dmg
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: app/mac/build/*.dmg }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: .\app\windows\build.ps1 -Zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: app/windows/build/*.zip }
  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.js && cp dist/marko-demo.html marko-demo.html && cp viewer/marko.html marko-viewer.html
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mac/*.dmg
            artifacts/windows/*.zip
            marko-viewer.html
            marko-demo.html
